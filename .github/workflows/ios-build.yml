name: iOS (swift test, XcodeGen, build non firmata, .ipa)

on:
  push:
    branches: [v2, main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  core-tests:
    # Il protocollo in Swift puro: stessi vettori di tests/test_protocol.py, senza simulatore.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ios/Packages/MagiCAMCore

  build:
    runs-on: macos-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: |
          set -e
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build non firmata (generic iOS device)
        # pipefail: senza, `xcodebuild | tee` faceva passare uno step con la build FALLITA (2026-10-15: run verde,
        # .ipa di 1,6 KB col solo Info.plist). Un verde senza l'eseguibile dentro e' un verde finto.
        run: |
          set -eo pipefail
          cd ios
          xcodebuild -project MagiCAM.xcodeproj -scheme MagiCAM -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcodebuild.log
      - name: Impacchetta .ipa
        run: |
          set -e
          APP=$(find ios/build/Build/Products -name 'MagiCAM.app' -type d | head -1)
          test -n "$APP"
          test -f "$APP/MagiCAM" || { echo "manca l'eseguibile dentro MagiCAM.app: build non riuscita"; exit 1; }
          ls -la "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr MagiCAM-unsigned.ipa Payload
          ls -la MagiCAM-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: MagiCAM-unsigned-ipa
          path: MagiCAM-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
